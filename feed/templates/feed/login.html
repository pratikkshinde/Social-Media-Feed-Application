{% extends 'feed/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-4 col-md-6 col-sm-8">
            <div class="premium-card auth-card">
                <div class="card-inner compact-form">
                    <div class="text-center mb-4">
                        <h2 class="brand-title">Flexr</h2>
                        <p class="auth-subtitle">Sign in to your account</p>
                    </div>

                    <form method="POST" novalidate>
                        {% csrf_token %}

                        {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label">
                                <i class="fas fa-{% if field.name == 'username' %}user{% else %}lock{% endif %} input-icon me-2"></i>
                                {{ field.label }}
                            </label>
                            {{ field }}
                            {% if field.errors %}
                            <div class="field-error mt-1">
                                {% for error in field.errors %}
                                <i class="fas fa-exclamation-circle me-1"></i>{{ error }}
                                {% endfor %}
                            </div>
                            {% endif %}
                        </div>
                        {% endfor %}

                        <button type="submit" class="btn btn-premium w-100 fw-semibold mt-2">
                            <i class="fas fa-unlock me-2"></i>Sign In to Account
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="auth-footer">New to Flexr?
                            <a href="{% url 'feed:register' %}" class="auth-link">Create Account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.auth-card {
    overflow: hidden;
}

.card-inner {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 28px 22px;
    position: relative;
    z-index: 1;
}

.brand-title {
    font-family: 'Engagement', cursive;
    font-size: 60px;
    font-weight: 400;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0;
    line-height: 1;
}

.auth-subtitle {
    color: var(--text-secondary);
    margin-top: 10px;
    margin-bottom: 0;
}

.form-label {
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 5px;
    font-size: 13px;
}

.form-control {
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    border-radius: 12px;
    padding: 12px 14px;
    height: 46px;
}

.form-control::placeholder {
    color: var(--text-muted);
}

.form-control:focus {
    background: var(--surface-soft);
    border-color: #667eea;
    box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
    color: var(--text-primary);
}

.input-icon {
    color: #667eea;
    width: 14px;
    font-size: 13px;
}

.field-error {
    color: #ff6b6b;
    font-size: 11px;
}

.auth-footer {
    color: var(--text-muted);
    margin: 0;
}

.auth-link {
    color: #667eea;
    font-weight: 600;
    text-decoration: none;
}

.auth-link:hover {
    color: #764ba2;
    text-decoration: underline;
}

.compact-form .mb-3 {
    margin-bottom: 0.8rem !important;
}
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const inputs = document.querySelectorAll('input[type="text"], input[type="email"], input[type="password"]');
        inputs.forEach(input => {
            input.classList.add('form-control');
        });
    });
</script>
{% endblock %}

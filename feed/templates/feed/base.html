<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexr - Premium Social Media</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Engagement&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(115deg, #20c997 0%, #5278f5 52%, #ff748d 100%);
            --card-border-gradient: linear-gradient(115deg, rgba(32, 201, 151, 0.42), rgba(82, 120, 245, 0.48), rgba(255, 116, 141, 0.4));
            --bg-primary: #111827;
            --bg-secondary: #1f2937;
            --bg-elevated: #2d3748;
            --card-bg: rgba(31, 41, 55, 0.78);
            --surface-soft: rgba(148, 163, 184, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.25);
            --shadow: rgba(15, 23, 42, 0.35);
            --input-bg: rgba(255,255,255,0.06);
        }

        body[data-theme="light"] {
            --bg-primary: #f3f6fb;
            --bg-secondary: #eaf0f8;
            --bg-elevated: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.76);
            --card-border-gradient: linear-gradient(115deg, rgba(18, 155, 120, 0.48), rgba(67, 95, 215, 0.48), rgba(215, 75, 105, 0.42));
            --surface-soft: rgba(96, 165, 250, 0.08);
            --text-primary: #111827;
            --text-secondary: #374151;
            --text-muted: #64748b;
            --border-color: rgba(15, 23, 42, 0.12);
            --shadow: rgba(148, 163, 184, 0.2);
            --input-bg: rgba(148, 163, 184, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                linear-gradient(135deg, rgba(32, 201, 151, 0.035), transparent 38%),
                linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.25s ease, color 0.25s ease;
        }

        .navbar {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        body[data-theme="light"] .navbar {
            background: rgba(255, 255, 255, 0.78);
        }

        .navbar-brand {
            font-family: 'Engagement', cursive;
            font-size: 35px;
            font-weight: 400;
            letter-spacing: 1px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-bg {
            background: var(--primary-gradient);
        }

        .premium-card {
            background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box, var(--card-border-gradient) border-box;
            border: 1px solid transparent;
            border-radius: 20px;
            box-shadow: 0 12px 30px var(--shadow);
            backdrop-filter: blur(18px) saturate(145%);
            -webkit-backdrop-filter: blur(18px) saturate(145%);
            color: var(--text-primary);
            position: relative;
            transition: transform 240ms ease, box-shadow 240ms ease, border-color 240ms ease;
            animation: card-enter 420ms ease both;
        }

        .premium-card:hover {
            transform: translateY(-3px);
            background-image: linear-gradient(var(--card-bg), var(--card-bg)) padding-box, var(--accent-gradient) border-box;
            box-shadow: 0 18px 38px var(--shadow), 0 0 0 1px rgba(102, 126, 234, 0.08);
        }

        @keyframes card-enter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-premium {
            background: var(--accent-gradient);
            background-size: 200% 200%;
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: 600;
            transition: transform 180ms ease, box-shadow 180ms ease, background-position 240ms ease;
            color: #fff;
        }

        .btn-premium:hover {
            transform: translateY(-2px) scale(1.015);
            background-position: 100% 50%;
            box-shadow: 0 9px 24px rgba(102, 126, 234, 0.38);
            color: #fff;
        }

        .btn,
        .theme-toggle {
            transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease, color 180ms ease;
        }

        .btn:active,
        .theme-toggle:active {
            transform: scale(0.97);
        }

        .btn:focus-visible,
        .theme-toggle:focus-visible,
        .nav-link:focus-visible {
            outline: 3px solid rgba(32, 201, 151, 0.72);
            outline-offset: 3px;
        }

        .form-control {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            padding: 12px 15px;
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        .form-control:focus {
            background: var(--surface-soft);
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            color: var(--text-primary);
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
        }

        .bg-gradient,
        .avatar-fallback {
            background: var(--primary-gradient);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .avatar-mark {
            font-weight: 800;
            font-size: 1.1rem;
            line-height: 1;
            color: #ffffff;
            letter-spacing: 0.04em;
        }

        .profile-pic-sm,
        .profile-pic-md,
        .profile-pic-large {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .profile-hero {
            display: grid;
            grid-template-columns: 152px minmax(0, 1fr);
            align-items: center;
            gap: 36px;
            padding: 32px 40px;
        }

        .profile-avatar-ring {
            width: 152px;
            height: 152px;
            padding: 3px;
            border-radius: 50%;
            background: var(--accent-gradient);
            box-shadow: 0 8px 24px rgba(82, 120, 245, 0.22);
        }

        .profile-avatar {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            border: 3px solid var(--card-bg);
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-information {
            min-width: 0;
        }

        .profile-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .profile-name {
            min-width: 0;
            margin: 0;
            color: var(--text-primary);
            font-size: 1.65rem;
            font-weight: 750;
            overflow-wrap: anywhere;
        }

        .profile-actions {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 8px;
        }

        .visitor-profile-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            width: 100%;
            margin-top: 22px;
        }

        .profile-wide-action {
            min-height: 52px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--surface-soft);
            color: var(--text-primary);
            font-weight: 650;
            transition: background-color 180ms ease, border-color 180ms ease, transform 180ms ease;
        }

        .profile-wide-action:hover {
            border-color: rgba(102, 126, 234, 0.45);
            background: rgba(102, 126, 234, 0.14);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        .profile-create-action {
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-radius: 12px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            margin: 22px 0 18px;
            padding: 16px 0;
            border-block: 1px solid var(--border-color);
        }

        .profile-stat {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 7px;
            min-width: 0;
            color: var(--text-muted);
        }

        .profile-stat + .profile-stat {
            border-left: 1px solid var(--border-color);
        }

        .profile-stat dd {
            margin: 0;
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: 750;
        }

        .profile-stat dt {
            font-size: 0.92rem;
            font-weight: 500;
        }

        .profile-bio {
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .profile-bio.empty {
            color: var(--text-muted);
        }

        .profile-tabs {
            padding: 14px 18px;
        }

        .profile-tabs a {
            display: inline-flex;
            align-items: center;
            min-height: 38px;
        }

        .profile-gallery .post-card {
            aspect-ratio: 1;
        }

        .profile-gallery .post-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-gallery .post-card > a {
            display: block;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 575.98px) {
            .profile-hero {
                grid-template-columns: 88px minmax(0, 1fr);
                align-items: center;
                column-gap: 16px;
                row-gap: 0;
                padding: 18px;
            }

            .profile-avatar-ring {
                grid-column: 1;
                grid-row: 1;
                width: 88px;
                height: 88px;
            }

            .profile-information {
                display: contents;
            }

            .profile-heading {
                grid-column: 2;
                grid-row: 1;
                flex-direction: column;
                align-items: flex-start;
                gap: 9px;
            }

            .profile-name {
                font-size: 1.15rem;
            }

            .profile-actions {
                flex-wrap: wrap;
                gap: 6px;
            }

            .visitor-profile-actions {
                grid-column: 1 / -1;
                grid-row: 4;
                gap: 8px;
                margin-top: 16px;
            }

            .profile-wide-action {
                min-height: 46px;
                padding: 0 8px;
                font-size: 0.88rem;
            }

            .profile-create-action {
                width: 38px;
                height: 38px;
            }

            .profile-stats {
                grid-column: 1 / -1;
                grid-row: 2;
                margin: 18px 0 14px;
                padding: 13px 0;
            }

            .profile-stat {
                flex-direction: column;
                align-items: center;
                gap: 2px;
            }

            .profile-stat dd {
                font-size: 1.08rem;
            }

            .profile-stat dt {
                font-size: 0.78rem;
            }

            .profile-bio {
                grid-column: 1 / -1;
                grid-row: 3;
                font-size: 0.92rem;
            }

            .profile-tabs {
                padding: 8px 10px;
            }
        }

        .nav-link {
            color: var(--text-primary) !important;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: #667eea !important;
            transform: translateY(-1px);
        }

        .btn-outline-light {
            border-color: var(--border-color) !important;
            color: var(--text-primary) !important;
            background: transparent;
        }

        .btn-outline-light:hover {
            background: var(--surface-soft);
            color: var(--text-primary) !important;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px var(--shadow);
        }

        .text-light {
            color: var(--text-primary) !important;
        }

        .text-muted,
        .text-secondary {
            color: var(--text-muted) !important;
        }

        .theme-toggle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            background: var(--surface-soft);
            color: var(--text-primary);
            transition: all 0.25s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            background: rgba(102, 126, 234, 0.12);
        }

        .theme-empty-state {
            color: var(--text-muted);
        }

        .mobile-bottom-nav {
            display: none;
        }

        @media (max-width: 991.98px) {
            body.mobile-nav-enabled .desktop-navbar .container {
                min-height: 58px;
                justify-content: center;
            }

            body.mobile-nav-enabled .desktop-navbar .navbar-brand {
                margin: 0;
                font-size: 32px;
            }

            body.mobile-nav-enabled .desktop-navbar .navbar-nav {
                display: none !important;
            }

            main.authenticated-page {
                margin-top: 16px !important;
                margin-bottom: 0 !important;
                padding-left: 14px;
                padding-right: 14px;
                padding-bottom: calc(100px + env(safe-area-inset-bottom)) !important;
            }

            .mobile-bottom-nav {
                position: fixed;
                z-index: 1030;
                left: 50%;
                bottom: calc(10px + env(safe-area-inset-bottom));
                width: min(calc(80vw - 26px), 448px);
                display: block;
                padding: 6px;
                transform: translateX(-50%);
                border: 1px solid rgba(255, 255, 255, 0.16);
                border-radius: 999px;
                background: rgba(10, 13, 20, 0.94);
                box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
                backdrop-filter: blur(22px) saturate(155%);
                -webkit-backdrop-filter: blur(22px) saturate(155%);
            }

            body[data-theme="light"] .mobile-bottom-nav {
                border-color: rgba(15, 23, 42, 0.12);
                background: rgba(255, 255, 255, 0.94);
                box-shadow: 0 12px 36px rgba(15, 23, 42, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            }

            .mobile-bottom-nav-inner {
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                align-items: center;
                max-width: 560px;
                margin: 0 auto;
            }

            .mobile-nav-link {
                min-width: 0;
                height: 45px;
                display: grid;
                align-items: center;
                justify-content: center;
                justify-items: center;
                color: var(--text-muted);
                text-decoration: none;
                border-radius: 999px;
                transition: color 180ms ease, transform 180ms ease, background-color 180ms ease;
            }

            .mobile-nav-link:active {
                transform: scale(0.94);
            }

            .mobile-nav-link:hover .mobile-nav-icon {
                color: var(--text-primary);
            }

            .mobile-nav-icon {
                width: 43px;
                height: 43px;
                display: grid;
                place-items: center;
                border-radius: 999px;
                font-size: 1.32rem;
                transition: background-color 180ms ease, color 180ms ease, transform 180ms ease;
            }

            .mobile-nav-link.active .mobile-nav-icon {
                background: rgba(255, 255, 255, 0.2);
                color: #fff;
            }

            body[data-theme="light"] .mobile-nav-link.active .mobile-nav-icon {
                background: rgba(15, 23, 42, 0.12);
                color: #111827;
            }

            .premium-card {
                border-radius: 16px;
                backdrop-filter: blur(14px) saturate(135%);
                -webkit-backdrop-filter: blur(14px) saturate(135%);
            }

            .premium-card:hover {
                transform: translateY(-1px);
            }

            .btn-premium,
            .btn-outline-light {
                min-height: 42px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body data-theme="dark"{% if user.is_authenticated %} class="mobile-nav-enabled"{% endif %}>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark desktop-navbar">
        <div class="container">
            <a class="navbar-brand" href="{% url 'feed:feed' %}">
                <i class="fas fa-bolt me-2"></i>Flexr
            </a>
            
            <div class="navbar-nav ms-auto align-items-center">
                {% if user.is_authenticated %}
                    <a class="nav-link mx-2" href="{% url 'feed:feed' %}">
                        <i class="fas fa-home me-1"></i>Home
                    </a>
                    <a class="nav-link mx-2" href="{% url 'feed:search_users' %}">
                        <i class="fas fa-search me-1"></i>Search
                    </a>
                    <a class="nav-link mx-2" href="{% url 'feed:chat_list' %}">
                        <i class="fas fa-comment me-1"></i>Messages
                    </a>
                    <a class="nav-link mx-2" href="{% url 'feed:profile' %}">
                        <i class="fas fa-user me-1"></i>Profile
                    </a>
                {% else %}
                    <button id="themeToggle" class="theme-toggle me-2" type="button" aria-label="Toggle theme">
                        <i class="fas fa-moon"></i>
                    </button>
                    <a class="nav-link mx-2" href="{% url 'login' %}">
                        <i class="fas fa-sign-in-alt me-1"></i>Login
                    </a>
                    <a class="nav-link mx-2" href="{% url 'feed:register' %}">
                        <i class="fas fa-user-plus me-1"></i>Register
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5{% if user.is_authenticated %} authenticated-page{% endif %}">
        {% block content %}
        {% endblock %}
    </main>

    {% if user.is_authenticated %}
    <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
        <div class="mobile-bottom-nav-inner">
            <a href="{% url 'feed:feed' %}" class="mobile-nav-link{% if request.resolver_match.url_name == 'feed' or request.resolver_match.url_name == 'post_detail' %} active{% endif %}" aria-label="Home"{% if request.resolver_match.url_name == 'feed' or request.resolver_match.url_name == 'post_detail' %} aria-current="page"{% endif %}>
                <span class="mobile-nav-icon"><i class="fas fa-house" aria-hidden="true"></i></span>
            </a>
            <a href="{% url 'feed:search_users' %}" class="mobile-nav-link{% if request.resolver_match.url_name == 'search_users' %} active{% endif %}" aria-label="Search"{% if request.resolver_match.url_name == 'search_users' %} aria-current="page"{% endif %}>
                <span class="mobile-nav-icon"><i class="fas fa-magnifying-glass" aria-hidden="true"></i></span>
            </a>
            <a href="{% url 'feed:create_post' %}" class="mobile-nav-link{% if request.resolver_match.url_name == 'create_post' %} active{% endif %}" aria-label="Upload"{% if request.resolver_match.url_name == 'create_post' %} aria-current="page"{% endif %}>
                <span class="mobile-nav-icon"><i class="fas fa-plus" aria-hidden="true"></i></span>
            </a>
            <a href="{% url 'feed:chat_list' %}" class="mobile-nav-link{% if request.resolver_match.url_name == 'chat_list' or request.resolver_match.url_name == 'chat_detail' %} active{% endif %}" aria-label="Messages"{% if request.resolver_match.url_name == 'chat_list' or request.resolver_match.url_name == 'chat_detail' %} aria-current="page"{% endif %}>
                <span class="mobile-nav-icon"><i class="fas fa-comment" aria-hidden="true"></i></span>
            </a>
            <a href="{% url 'feed:profile' %}" class="mobile-nav-link{% if request.resolver_match.url_name == 'profile' or request.resolver_match.url_name == 'user_profile' %} active{% endif %}" aria-label="Profile"{% if request.resolver_match.url_name == 'profile' or request.resolver_match.url_name == 'user_profile' %} aria-current="page"{% endif %}>
                <span class="mobile-nav-icon"><i class="fas fa-user" aria-hidden="true"></i></span>
            </a>
        </div>
    </nav>
    {% endif %}

    <!-- Footer -->
    <footer class="text-center py-4 text">
        <div class="container">
            <p>&copy; 2025 Flexr. Designed with <i class="fas fa-heart text-danger"></i> for cute experience.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script>
        function applyTheme(theme) {
            const body = document.body;
            body.setAttribute('data-theme', theme);
            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                const icon = toggle.querySelector('i');
                if (icon) {
                    icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
                }
            }
            localStorage.setItem('flexr-theme', theme);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('flexr-theme') || 'dark';
            applyTheme(savedTheme);

            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                toggle.addEventListener('click', function() {
                    const currentTheme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    applyTheme(currentTheme);
                });
            }

        });
    </script>
   
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexr - Social Media</title> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-900: #090d19;
            --bg-800: #111a2e;
            --card: rgba(16, 25, 45, 0.78);
            --card-border: rgba(135, 160, 255, 0.24);
            --text-main: #eff3ff;
            --text-muted: #99a5c5;
            --brand-a: #7f8dff;
            --brand-b: #38d9f5;
            --danger: #ff6d8e;
            --brand-gradient: linear-gradient(135deg, var(--brand-a), var(--brand-b));
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 0%, rgba(126, 140, 255, 0.22), transparent 40%),
                radial-gradient(circle at 80% 100%, rgba(56, 217, 245, 0.2), transparent 35%),
                linear-gradient(160deg, var(--bg-900), var(--bg-800) 60%, #0a1020);
        }
        .main-nav {
            background: rgba(10, 17, 32, 0.82);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(132, 154, 242, 0.28);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.4px;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-link { color: var(--text-main) !important; opacity: 0.85; }
        .nav-link:hover { opacity: 1; transform: translateY(-1px); }
        .premium-card {
            background: var(--card);
            border-radius: 18px;
            border: 1px solid var(--card-border);
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }
        .btn-premium {
            background: var(--brand-gradient);
            border: none;
            color: #0b1020;
            font-weight: 700;
            border-radius: 12px;
            padding: 10px 20px;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .btn-premium:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(86, 128, 255, 0.35);
        }
        .form-control, .form-select, input[type="text"], input[type="password"], input[type="email"], textarea {
            background: rgba(9, 14, 30, 0.8) !important;
            color: var(--text-main) !important;
            border: 1px solid rgba(142, 162, 241, 0.34) !important;
            border-radius: 12px !important;
        }
        .form-control:focus, .form-select:focus, input:focus, textarea:focus {
            box-shadow: 0 0 0 0.2rem rgba(127, 141, 255, 0.2) !important;
            border-color: rgba(130, 149, 255, 0.85) !important;
        }
        ::placeholder { color: #7f8ba9 !important; }
        .text-muted { color: var(--text-muted) !important; }
        .gradient-text {
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-gradient { background: var(--brand-gradient); }
        .profile-pic-sm { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
        .page-wrap { padding: 2.5rem 0 3rem; }
        footer { border-top: 1px solid rgba(115, 135, 220, 0.2); margin-top: 2rem; }
        .btn-outline-light { border-color: rgba(150, 170, 255, 0.55); color: #d9e3ff; }
        .btn-outline-light:hover { background: rgba(127, 141, 255, 0.15); color: #ffffff; border-color: rgba(150, 170, 255, 0.75); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark main-nav sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'feed:feed' %}">
                <i class="fas fa-wave-square me-2"></i>Flexr
            </a>
            <div class="navbar-nav ms-auto align-items-lg-center">
                {% if user.is_authenticated %}
                    <a class="nav-link mx-2" href="{% url 'feed:feed' %}"><i class="fas fa-home me-1"></i>Feed</a>
                    <a class="nav-link mx-2" href="{% url 'feed:search_users' %}"><i class="fas fa-search me-1"></i>Explore</a>
                    <a class="nav-link mx-2" href="{% url 'feed:chat_list' %}"><i class="fas fa-comment-dots me-1"></i>Chats</a>
                    <a class="nav-link mx-2" href="{% url 'feed:profile' %}"><i class="fas fa-user me-1"></i>Profile</a>
                    <form method="post" action="{% url 'logout' %}" class="d-inline ms-lg-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="fas fa-right-from-bracket me-1"></i>Logout
                        </button>
                    </form>
                {% else %}
                    <a class="nav-link mx-2" href="{% url 'login' %}"><i class="fas fa-sign-in-alt me-1"></i>Login</a>
                    <a class="nav-link mx-2" href="{% url 'feed:register' %}"><i class="fas fa-user-plus me-1"></i>Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container page-wrap">
        {% block content %}{% endblock %}
    </main>
    <footer class="text-center py-4 text-muted">
        <div class="container">
            <p class="mb-0">&copy; 2026 Flexr. Share moments, build community.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.premium-card').forEach(function (card, index) {
                card.style.opacity = '0';
                card.style.transform = 'translateY(10px)';
                setTimeout(function () {
                    card.style.transition = 'opacity .25s ease, transform .25s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 70);
            });
        });
    </script>
</body>
</html>
